# ==========================================
# MERCADUCA - Application Configuration
# ==========================================
spring.application.name=mercaduca
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api/v1

# ==========================================
# DATABASE - PostgreSQL
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mercaduca}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==========================================
# JWT SECURITY
# ==========================================
application.security.jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}
application.security.jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ==========================================
# FILE UPLOAD
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=${UPLOAD_DIR:./uploads}

# ==========================================
# MAIL (deshabilitado — configurar en produccion)
# ==========================================
management.health.mail.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# ==========================================
# CORS
# ==========================================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:4200}
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.max-age=3600

# ==========================================
# SWAGGER / OPENAPI
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# ==========================================
# PAYMENT PROVIDERS
# ==========================================
app.payment.stripe.api-key=${STRIPE_API_KEY:sk_test_placeholder}
app.payment.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
app.payment.paypal.client-id=${PAYPAL_CLIENT_ID:placeholder}
app.payment.paypal.client-secret=${PAYPAL_CLIENT_SECRET:placeholder}
app.payment.paypal.mode=${PAYPAL_MODE:sandbox}

# ==========================================
# SHIPPING PROVIDERS
# ==========================================
app.shipping.dhl.api-key=${DHL_API_KEY:placeholder}
app.shipping.dhl.base-url=${DHL_BASE_URL:https://api-mock.dhl.com/mydhlapi}
app.shipping.correos.api-key=${CORREOS_API_KEY:placeholder}
app.shipping.uberdirect.client-id=${UBERDIRECT_CLIENT_ID:placeholder}
app.shipping.uberdirect.client-secret=${UBERDIRECT_CLIENT_SECRET:placeholder}

# ==========================================
# ACTUATOR
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ==========================================
# LOGGING
# ==========================================
logging.level.com.mercaduca=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
